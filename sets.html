<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sets — Cake's Feats</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <main class="container">

        <header class="site-header">

            <div class="brand">
                <h1>Cake's Feats</h1>
                <p id="random-subtitle">la peace man</p>
            </div>

            <nav>
                <a href="./index.html">home</a>
                <a href="./sets.html" class="active">sets</a>
            </nav>

        </header>


        <section class="sets-top">

            <div class="sets-title">
                <span class="eyebrow">archive</span>
                <h2>sets</h2>
                <p>every fight, every score, every stupid decision</p>
            </div>


            <div class="search-wrapper">

                <div class="search-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="11" cy="11" r="6.5"></circle>
                        <path d="M16 16L21 21"></path>
                    </svg>
                </div>

                <input
                    type="text"
                    placeholder="search sets..."
                    aria-label="Search sets"
                >

                <span class="search-key">⌕</span>

            </div>

        </section>


        <section class="set-controls">

            <div class="filters">

                <button class="filter active">
                    all
                    <span>0</span>
                </button>

                <button class="filter">
                    wins
                    <span>0</span>
                </button>

                <button class="filter">
                    losses
                    <span>0</span>
                </button>

            </div>


            <div class="set-count">
                <span>0 sets</span>
            </div>

        </section>


        <section class="sets-list">

            <div class="empty-state">

                <div class="empty-icon">
                    —
                </div>

                <h3>nothing here yet</h3>

                <p>
                    your sets will show up here once you start logging them.
                </p>

            </div>

        </section>

    </main>


    <script src="./script.js"></script>

</body>
</html>
