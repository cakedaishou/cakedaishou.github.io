<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sets — Cake's Feats</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body class="sets-page">

    <main class="container">

        <header class="site-header">

            <nav>
                <a href="./index.html">home</a>
                <a href="./sets.html" class="active">sets</a>
            </nav>

        </header>


        <section class="sets-top">

            <div class="sets-title">

                <span class="eyebrow">archive</span>

                <h1>sets</h1>

                <p id="random-subtitle">every fight and every score</p>

            </div>


            <div class="search-wrapper">

                <div class="search-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="11" cy="11" r="6.5"></circle>
                        <path d="M16 16L21 21"></path>
                    </svg>
                </div>

                <input
                    type="text"
                    placeholder="search sets..."
                    aria-label="Search sets"
                >

                <span class="search-key">⌕</span>

            </div>

        </section>


        <section class="set-controls">

            <div class="filters">

                <button class="filter active" data-filter="all">
                    all
                    <span>1</span>
                </button>

                <button class="filter" data-filter="win">
                    wins
                    <span>1</span>
                </button>

                <button class="filter" data-filter="loss">
                    losses
                    <span>0</span>
                </button>

            </div>


            <div class="set-count">
                <span>1 set</span>
            </div>

        </section>


        <section class="sets-list">

            <article class="set-card">

                <div class="set-card-top">

                    <div class="set-opponent">
                        <span>vs</span>
                        <strong>Deity</strong>
                    </div>

                    <div class="set-result win">
                        win
                    </div>

                </div>


                <div class="set-score">
                    10 <span>—</span> 7
                </div>


                <div class="set-card-details">

                    <div class="set-detail">
                        <span>format</span>
                        <strong>FT10</strong>
                    </div>

                    <div class="set-detail">
                        <span>character</span>
                        <strong>Saitama</strong>
                    </div>

                    <div class="set-detail">
                        <span>date</span>
                        <strong>02 Sep 2026</strong>
                    </div>

                </div>

            </article>

        </section>

    </main>


    <script src="./script.js"></script>

</body>
</html>
